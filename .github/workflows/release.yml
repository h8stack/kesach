name: Build/release

on:
  push:
  workflow_dispatch:

concurrency:
  # Cancel superseded branch builds, but never interrupt a tag release.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # One failing platform must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: win
          - os: ubuntu-24.04-arm
            platform: linux

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux arm64 build tooling
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 make g++ ruby-full libffi-dev zlib1g-dev liblzma-dev pkg-config
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: yarn install

      - name: TypeScript type check
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false

      - name: Set environment variable USE_SYSTEM_FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV
      - name: Set environment variable USE_HARD_LINKS
        run: echo "USE_HARD_LINKS=false" >> $GITHUB_ENV

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/ci-patch-package.js set-version "${{ github.ref_name }}"
      - name: Modify package.json for dev branch
        if: github.ref == 'refs/heads/dev'
        run: node scripts/ci-patch-package.js dev
      - name: Modify package.json for Linux arm64 build
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: node scripts/ci-patch-package.js linux-arm64

      - name: Build Electron app
        shell: bash
        run: |
          yarn build
          npx electron-builder --${{ matrix.platform }} --publish never

      - name: Verify Windows build outputs
        if: success() && startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          ls -lh dist/*.exe dist/*.zip
          test -n "$(ls dist/*-Setup.exe 2>/dev/null)" || { echo "::error::NSIS setup installer missing"; exit 1; }
          test -n "$(ls dist/*-Portable.exe 2>/dev/null)" || { echo "::error::Portable exe missing"; exit 1; }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kesach-${{ matrix.os }}
          path: |
            dist/*.exe
            !dist/*.__uninstaller.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          overwrite_files: true
          generate_release_notes: true
